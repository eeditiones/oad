name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # eXist-db snapshots are published to GitHub Packages
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run tests
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: version
        run: echo "version=$(sed -n 's/^version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: xar
          path: build/libs/oad-*.xar
          if-no-files-found: error
      # eXist-db only loads the Java module of a package on startup,
      # so the XAR is autodeployed before the container is started.
      # the latest image is built from develop, as are the snapshots oad is built against
      - name: Start eXist-db with oad installed
        run: |
          docker create --name exist -p 8080:8080 existdb/existdb:latest
          docker cp build/libs/oad-${{ steps.version.outputs.version }}.xar exist:/exist/autodeploy/
          docker start exist
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' exist)" = healthy ] && exit 0
            sleep 3
          done
          docker logs exist
          exit 1
      # the tests run in the build, this checks that the XAR installs and the module can be called
      - name: Call oad
        run: |
          query='import module namespace oad="//eeditiones.org/ns/oad";
            xmldb:store("/db", "smoke.json", "{""openapi"":""3.0.2"",""info"":{""title"":""smoke"",""version"":""1""},""paths"":{}}")
            ! oad:validate(.)'
          result=$(curl -sf -u admin: -G http://localhost:8080/exist/rest/db --data-urlencode "_query=$query" --data-urlencode _wrap=no)
          echo "oad:validate returned: $result"
          [ "$result" = true ]
      - if: failure()
        run: docker logs exist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag matches project version
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ needs.build.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${{ needs.build.outputs.version }} in gradle.properties"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: xar
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" oad-*.xar --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
